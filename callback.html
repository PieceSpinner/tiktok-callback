<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok → бот</title>
<style>
  :root { --bg: #fff; --fg: #111; --box: #f2f2f2; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #eee; --box: #222; } }
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px;
         background: var(--bg); color: var(--fg); }
  code { display: block; word-break: break-all; background: var(--box); padding: 12px;
         border-radius: 8px; margin: 12px 0; font-size: 13px; }
  button { font-size: 16px; padding: 12px 18px; border-radius: 8px; border: 0;
           background: #fe2c55; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<h2 id="title">Почти готово</h2>
<p id="hint">Скопируй ссылку ниже и отправь её боту в Telegram.</p>
<code id="out"></code>
<button id="copy">Скопировать</button>
<script>
  const params = new URLSearchParams(location.search);
  const out = document.getElementById('out');
  const btn = document.getElementById('copy');
  if (params.get('code')) {
    out.textContent = location.href;
  } else {
    document.getElementById('title').textContent = 'Не получилось';
    document.getElementById('hint').textContent = 'TikTok не прислал код. Попробуй войти ещё раз.';
    out.textContent = params.get('error_description') || params.get('error') || 'В ссылке нет кода';
    btn.hidden = true;
  }
  btn.onclick = () => navigator.clipboard.writeText(out.textContent)
    .then(() => { btn.textContent = 'Скопировано ✓'; });
</script>
</body>
</html>
